name: Luu lich su Tam hoa Bingo18

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Lay bo file trong GitHub
        uses: actions/checkout@v4

      - name: Chuan bi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cai thu vien Excel
        run: python -m pip install openpyxl==3.1.5

      - name: Lay du lieu va cap nhat Excel
        run: python github_bingo18/bingo18_automation.py

      - name: Luu file Excel moi vao GitHub
        run: |
          git config user.name "Bingo18 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add github_bingo18/Bingo18_Lich_su_Tam_hoa.xlsx
          if git diff --cached --quiet; then
            echo "Khong co thay doi moi."
          else
            git commit -m "Cap nhat Tam hoa $(date -u +'%Y-%m-%d')"
            git push
          fi
